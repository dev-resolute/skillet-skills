          object(s), they will be ignored
  - name: list owners
    method: GET
    url: https://api.hubapi.com/crm/v3/owners
    read_only: true
    params:
      - name: after
        type: string
        required: false
        location: query
        description: Paging cursor from a previous response's paging.next.after.
      - name: archived
        type: boolean
        required: false
        location: query
        description: Whether to return only results that have been archived.
      - name: email
        type: string
        required: false
        location: query
        description: Filter to the owner with this email address.
      - name: limit
        type: integer
        format: int32
        required: false
        location: query
        description: Maximum number of results per page.
    description: List all owners (HubSpot users who can be assigned records) in the account.
  - name: get owner
    description: Retrieve a specific owner by ID
    method: GET
    url: https://api.hubapi.com/crm/v3/owners/{ownerId}
    read_only: true
    params:
      - name: ownerId
        type: integer
        format: int32
        required: true
        location: path
        description: HubSpot owner ID.
      - name: archived
        type: boolean
        required: false
        location: query
        description: Whether to return only results that have been archived.
      - name: idProperty
        type: string
        enum:
          - id
          - userId
        required: false
        location: query
        description: Whether ownerId is the owner's id or userId.
  - name: list pipelines
    description: Retrieve all pipelines
    method: GET
    url: https://api.hubapi.com/crm/v3/pipelines/{objectType}
    read_only: true
    params:
      - name: objectType
        type: string
        required: true
        location: path
        description: CRM object type — e.g. contacts, companies, deals, tickets, products, or line_items.
  - name: get pipeline
    description: Return a pipeline by ID
    method: GET
    url: https://api.hubapi.com/crm/v3/pipelines/{objectType}/{pipelineId}
    read_only: true
    params:
      - name: objectType
        type: string
        required: true
        location: path
        description: CRM object type — e.g. contacts, companies, deals, tickets, products, or line_items.
      - name: pipelineId
        type: string
        required: true
        location: path
        description: ID of the pipeline.
  - name: list pipeline stages
    description: Return all stages of a pipeline
    method: GET
    url: https://api.hubapi.com/crm/v3/pipelines/{objectType}/{pipelineId}/stages
    read_only: true
    params:
      - name: objectType
        type: string
        required: true
        location: path
        description: CRM object type — e.g. contacts, companies, deals, tickets, products, or line_items.
      - name: pipelineId
        type: string
        required: true
        location: path
        description: ID of the pipeline.
  - name: get pipeline stage
    description: Return a single pipeline stage identified by its stageId.
    method: GET
    url: https://api.hubapi.com/crm/v3/pipelines/{objectType}/{pipelineId}/stages/{stageId}
    read_only: true
    params:
      - name: objectType
        type: string
        required: true
        location: path
        description: CRM object type — e.g. contacts, companies, deals, tickets, products, or line_items.
      - name: pipelineId
        type: string
        required: true
        location: path
        description: ID of the pipeline.
      - name: stageId
        type: string
        required: true
        location: path
        description: ID of the pipeline stage.
  - name: list properties
    description: Read all properties
    method: GET
    url: https://api.hubapi.com/crm/v3/properties/{objectType}
    read_only: true
    params:
      - name: objectType
        type: string
        required: true
        location: path
        description: CRM object type — e.g. contacts, companies, deals, tickets, products, or line_items.
      - name: archived
        type: boolean
        required: false
        location: query
        description: Whether to return only results that have been archived.
      - name: dataSensitivity
        type: string
        enum:
          - highly_sensitive
          - non_sensitive
          - sensitive
        required: false
        location: query
        description: Filter to properties at this data-sensitivity level.
      - name: locale
        type: string
        required: false
        location: query
        description: Locale code for translated property labels, e.g. en or de.
      - name: properties
        type: string
        required: false
        location: query
        description: Comma-separated list of property names to limit the response to.
  - name: list associations
    description: Retrieve all associations by object type
    method: GET
    url: https://api.hubapi.com/crm/v4/objects/{objectType}/{objectId}/associations/{toObjectType}
    read_only: true
    params:
      - name: objectId
        type: string
        required: true
        location: path
        description: ID of the object to retrieve associations from.
      - name: objectType
        type: string
        required: true
        location: path
        description: CRM object type — e.g. contacts, companies, deals, tickets, products, or line_items.
      - name: toObjectType
        type: string
        required: true
        location: path
        description: CRM object type to retrieve associations to — e.g. contacts, companies, deals, tickets.
      - name: after
        type: string
        required: false
        location: query
        description: The paging cursor token of the last successfully read resource will be returned as the
          `paging.next.after` JSON property of a paged response containing more results.
      - name: limit
        type: integer
        format: int32
        required: false
        location: query
        description: The maximum number of results to display per page.
