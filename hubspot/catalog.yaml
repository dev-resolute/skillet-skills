slug: hubspot
version: 1.0.0
name: HubSpot
category: business-support
one_liner: Read contacts, companies, deals, and tickets from your HubSpot CRM.
api_domain: api.hubapi.com
status: live
credentials:
  - env_var: HUBSPOT_ACCESS_TOKEN
    label: HubSpot private app access token (crm.objects.*.read scopes)
    help_url: https://developers.hubspot.com/docs/api/private-apps
auth:
  scheme: bearer
  header: Authorization
  env_vars:
    - HUBSPOT_ACCESS_TOKEN
  value_template: Bearer ${HUBSPOT_ACCESS_TOKEN}
operations:
  - name: list contacts
    description: Retrieve contacts
    method: GET
    url: https://api.hubapi.com/crm/v3/objects/contacts
    read_only: true
    params:
      - name: after
        type: string
        required: false
        location: query
        description: The paging cursor token of the last successfully read resource will be returned as the
          `paging.next.after` JSON property of a paged response containing more results.
      - name: archived
        type: boolean
        required: false
        location: query
        description: Whether to return only results that have been archived.
      - name: associations
        type: array
        items_type: string
        required: false
        location: query
        description: A comma separated list of object types to retrieve associated IDs for. If any of the
          specified associations do not exist, they will be ignored.
      - name: limit
        type: integer
        format: int32
        required: false
        location: query
        description: The maximum number of results to display per page.
      - name: properties
        type: array
        items_type: string
        required: false
        location: query
        description: Comma-separated property names to return.
      - name: propertiesWithHistory
        type: array
        items_type: string
        required: false
        location: query
        description: A comma separated list of the properties to be returned along with their history of
          previous values. If any of the specified properties are not present on the requested
          object(s), they will be ignored
  - name: get contact
    description: Retrieve a contact
    method: GET
    url: https://api.hubapi.com/crm/v3/objects/contacts/{contactId}
    read_only: true
    params:
      - name: contactId
        type: string
        required: true
        location: path
        description: HubSpot contact ID.
      - name: archived
        type: boolean
        required: false
        location: query
        description: Whether to return only results that have been archived.
      - name: associations
        type: array
        items_type: string
        required: false
        location: query
        description: A comma separated list of object types to retrieve associated IDs for. If any of the
          specified associations do not exist, they will be ignored.
      - name: idProperty
        type: string
        required: false
        location: query
        description: The name of a property whose values are unique for this object type
      - name: properties
        type: array
        items_type: string
        required: false
        location: query
        description: A comma separated list of the properties to be returned in the response. If any of the
          specified properties are not present on the requested object(s), they will be ignored.
      - name: propertiesWithHistory
        type: array
        items_type: string
        required: false
        location: query
        description: A comma separated list of the properties to be returned along with their history of
          previous values. If any of the specified properties are not present on the requested
          object(s), they will be ignored
