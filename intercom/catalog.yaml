          - "2.14"
          - "2.15"
          - "2.16"
        required: true
        location: header
        description: Intercom API version to pin the response shape to. Keep the example value (2.16) unless
          you have a specific reason to call against an older API version.
      - name: display_avatar
        type: boolean
        required: false
        location: query
        description: If set to true, the response will include the admin's avatar object containing the
          image URL. Defaults to false.
