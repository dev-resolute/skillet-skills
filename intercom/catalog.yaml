slug: intercom
version: 1.0.0
name: Intercom
category: business-support
one_liner: Read contacts, companies, conversations, and admins from Intercom.
api_domain: api.intercom.io
status: live
credentials:
  - env_var: INTERCOM_ACCESS_TOKEN
    label: Intercom access token (from a workspace app)
    help_url: https://developers.intercom.com/docs/build-an-integration/learn-more/authentication
auth:
  scheme: bearer
  header: Authorization
  env_vars:
    - INTERCOM_ACCESS_TOKEN
  value_template: Bearer ${INTERCOM_ACCESS_TOKEN}
operations:
  - name: get current admin
    description: Identify an admin
    method: GET
    url: https://api.intercom.io/me
    read_only: true
    params:
      - name: Intercom-Version
        type: string
        enum:
          - "1.0"
          - "1.1"
          - "1.2"
          - "1.3"
          - "1.4"
          - "2.0"
          - "2.1"
          - "2.2"
          - "2.3"
          - "2.4"
          - "2.5"
          - "2.6"
          - "2.7"
          - "2.8"
          - "2.9"
          - "2.10"
          - "2.11"
          - "2.12"
          - "2.13"
          - "2.14"
          - "2.15"
          - "2.16"
        required: true
        location: header
        description: Intercom API version to pin the response shape to. Keep the example value (2.16) unless
          you have a specific reason to call against an older API version.
  - name: list admins
    description: List all admins
    method: GET
    url: https://api.intercom.io/admins
    read_only: true
    params:
      - name: Intercom-Version
        type: string
