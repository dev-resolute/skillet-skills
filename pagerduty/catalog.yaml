      - name: since
        type: string
        format: date-time
        required: false
        location: query
        description: The start of the date range over which you want to search.
      - name: until
        type: string
        format: date-time
        required: false
        location: query
        description: The end of the date range over which you want to search.
      - name: is_overview
        type: boolean
        required: false
        location: query
        description: If `true`, will return a subset of log entries that show only the most important
          changes to the incident.
      - name: include[]
        type: string
        enum:
          - incidents
          - services
          - channels
          - teams
        required: false
        location: query
        description: Array of additional Models to include in response.
