      - name: sort_by
        type: string
        enum:
          - created_at
          - resolved_at
          - created_at:asc
          - created_at:desc
          - resolved_at:asc
          - resolved_at:desc
        required: false
        location: query
        description: Used to specify both the field you wish to sort the results on
          (created_at/resolved_at), as well as the direction (asc/desc) of the results. The sort_by
          field and direction should be separated by a co
      - name: include[]
        type: string
        enum:
          - services
          - first_trigger_log_entries
          - incidents
        required: false
        location: query
        description: Array of additional details to include.
  - name: get alert for incident
