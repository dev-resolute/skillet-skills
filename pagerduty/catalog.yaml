slug: pagerduty
version: 1.1.0
name: PagerDuty
category: incident-observability
one_liner: Read incidents, services, schedules, and on-call data from PagerDuty.
api_domain: api.pagerduty.com
status: live
credentials:
  - env_var: PAGERDUTY_API_KEY
    label: PagerDuty REST API key
    help_url: https://support.pagerduty.com/main/docs/api-access-keys
auth:
  scheme: api_key
  header: Authorization
  env_vars:
    - PAGERDUTY_API_KEY
  value_template: Token token=${PAGERDUTY_API_KEY}
operations:
  - name: list incidents
    description: List incidents, filterable by status.
    method: GET
    url: https://api.pagerduty.com/incidents
    read_only: true
    params:
      - name: limit
        type: integer
        required: false
        location: query
        description: The number of results per page. Maximum of 100.
      - name: offset
        type: integer
        required: false
        location: query
        description: Offset to start pagination search results.
      - name: total
        type: boolean
        required: false
        location: query
        description: >-
          By default the `total` field in pagination responses is set to `null` to provide the
          fastest possible response times. Set `total` to `true` for this field to be populated.


          See our [Pagination Docs](h
      - name: date_range
        type: string
        enum:
          - all
        required: false
        location: query
        description: When set to all, the since and until parameters and defaults are ignored.
      - name: incident_key
        type: string
        required: false
        location: query
        description: Incident de-duplication key. Incidents with child alerts do not have an incident key;
          querying by incident key will return incidents whose alerts have alert_key matching the
          given incident key.
      - name: service_ids[]
        type: array
        items_type: string
        required: false
        location: query
        description: Returns only the incidents associated with the passed service(s). This expects one or
          more service IDs.
      - name: team_ids[]
        type: array
        items_type: string
        required: false
        location: query
        description: An array of team IDs. Only results related to these teams will be returned. Account
          must have the `teams` ability to use this parameter.
      - name: user_ids[]
        type: array
        items_type: string
        required: false
        location: query
        description: "Returns only the incidents currently assigned to the passed user(s). This expects one
          or more user IDs. Note: When using the assigned_to_user filter, you will only receive
          incidents with statuses of t"
      - name: urgencies[]
        type: array
        items_type: string
        enum:
          - high
          - low
        required: false
        location: query
        description: Array of the urgencies of the incidents to be returned. Defaults to all urgencies.
          Account must have the `urgencies` ability to do this.
      - name: time_zone
        type: string
        format: tzinfo
        required: false
        location: query
        description: Time zone in which results will be rendered. This will default to the account time zone.
      - name: statuses[]
        type: array
        items_type: string
        enum:
          - triggered
          - acknowledged
          - resolved
        required: false
        location: query
        description: "Return only incidents with the given statuses. To query multiple statuses, pass
          `statuses[]` more than once, for example:
          `https://api.pagerduty.com/incidents?statuses[]=triggered&statuses[]=acknowled"
      - name: sort_by
        type: array
        items_type: string
        required: false
        location: query
        description: Used to specify both the field you wish to sort the results on
          (incident_number/created_at/resolved_at/urgency), as well as the direction (asc/desc) of
          the results. The sort_by field and direction sho
      - name: include[]
        type: string
        enum:
          - acknowledgers
          - agents
          - assignees
          - conference_bridge
          - escalation_policies
          - first_trigger_log_entries
          - priorities
          - services
          - teams
          - users
        required: false
        location: query
        description: Array of additional details to include.
      - name: since
        type: string
        format: date-time
        required: false
        location: query
        description: The start of the date range over which you want to search. Maximum range is 6 months
          and default is 1 month.
      - name: until
        type: string
        format: date-time
        required: false
        location: query
        description: The end of the date range over which you want to search. Maximum range is 6 months and
          default is 1 month.
  - name: get incident
    description: Fetch one incident by id.
    method: GET
    url: https://api.pagerduty.com/incidents/{id}
    read_only: true
    params:
      - name: id
        type: string
        required: true
        location: path
        description: The ID of the resource.
      - name: include[]
        type: string
        enum:
          - acknowledgers
          - agents
          - assignees
          - conference_bridge
          - custom_fields
          - escalation_policies
          - first_trigger_log_entries
          - priorities
          - services
          - teams
          - users
        required: false
        location: query
        description: Array of additional details to include.
