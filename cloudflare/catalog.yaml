slug: cloudflare
version: 1.1.0
name: Cloudflare
category: infra-cloud
one_liner: Read zones, DNS, Workers, storage, and logs on Cloudflare, and purge cache.
api_domain: api.cloudflare.com
status: live
credentials:
  - env_var: CLOUDFLARE_API_TOKEN
    label: Cloudflare API token
    help_url: https://developers.cloudflare.com/fundamentals/api/get-started/create-token/
auth:
  scheme: bearer
  header: Authorization
  env_vars:
    - CLOUDFLARE_API_TOKEN
  value_template: Bearer ${CLOUDFLARE_API_TOKEN}
operations:
  - name: get current user
    description: User Details
    method: GET
    url: https://api.cloudflare.com/client/v4/user
    read_only: true
    params: []
  - name: verify api token
    description: Verify Token
    method: GET
    url: https://api.cloudflare.com/client/v4/user/tokens/verify
    read_only: true
    params: []
  - name: list accounts
    description: List Accounts
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts
    read_only: true
    params:
      - name: name
        type: string
        required: false
        location: query
        description: Name of the account.
      - name: page
        type: number
        required: false
        location: query
        description: Page number of paginated results.
      - name: per_page
        type: number
        required: false
        location: query
        description: Maximum number of results per page.
      - name: direction
        type: string
        enum:
          - asc
          - desc
        required: false
        location: query
        description: Direction to order results.
  - name: get account
    description: Account Details
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
        description: Account identifier tag.
  - name: list account members
    description: List Members
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/members
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
        description: Account identifier tag.
      - name: order
        type: string
        enum:
          - user.first_name
          - user.last_name
          - user.email
          - status
        required: false
        location: query
        description: Field to order results by.
      - name: status
        type: string
        enum:
          - accepted
          - pending
          - rejected
        required: false
        location: query
        description: A member's status in the account.
      - name: page
        type: number
        required: false
        location: query
        description: Page number of paginated results.
      - name: per_page
        type: number
        required: false
        location: query
        description: Maximum number of results per page.
      - name: direction
        type: string
        enum:
          - asc
          - desc
        required: false
        location: query
        description: Direction to order results.
  - name: list account roles
    description: List Roles
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/roles
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
        description: Account identifier tag.
      - name: page
        type: number
        required: false
        location: query
        description: Page number of paginated results.
      - name: per_page
        type: number
        required: false
        location: query
        description: Number of roles per page.
  - name: list account api tokens
    description: List Tokens
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/tokens
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
        description: Account identifier tag.
      - name: page
        type: number
        required: false
        location: query
        description: Page number of paginated results.
      - name: per_page
        type: number
        required: false
        location: query
        description: Maximum number of results per page.
      - name: direction
        type: string
        enum:
          - asc
          - desc
        required: false
        location: query
        description: Direction to order results.
      - name: include_expired
        type: boolean
        required: false
        location: query
        description: When true, includes recently-expired tokens in the response.
  - name: list zones
    description: List zones on the account.
    method: GET
    url: https://api.cloudflare.com/client/v4/zones
    read_only: true
    params:
      - name: name
        type: string
        required: false
        location: query
        description: |-
          A domain name. Optional filter operators can be provided to extend refine the search:
            * `equal` (default)
            * `not_equal`
            * `starts_with`
            * `ends_with`
            * `contains`
            * `starts_with_case_sensi
      - name: status
        type: string
        enum:
          - initializing
          - pending
          - active
          - moved
        required: false
        location: query
        description: Specify a zone status to filter by.
      - name: type
        type: array
        items_type: string
        enum:
          - full
          - partial
          - secondary
          - internal
        required: false
        location: query
        description: Zone types to filter by. Multiple types can be specified as a comma-separated list
          (e.g., ?type=full,partial,secondary). When this parameter is not provided, zones with type
          "internal" are excluded fr
      - name: account.id
        type: string
        required: false
        location: query
        description: Filter by an account ID.
      - name: account.name
        type: string
        required: false
        location: query
        description: |-
          An account Name. Optional filter operators can be provided to extend refine the search:
            * `equal` (default)
            * `not_equal`
            * `starts_with`
            * `ends_with`
            * `contains`
            * `starts_with_case_sen
      - name: page
        type: number
        required: false
        location: query
        description: Page number of paginated results.
      - name: per_page
        type: number
        required: false
        location: query
        description: Number of zones per page.
      - name: order
        type: string
        enum:
          - name
          - status
          - account.id
          - account.name
          - plan.id
        required: false
        location: query
        description: Field to order zones by.
      - name: direction
        type: string
        enum:
          - asc
          - desc
        required: false
        location: query
        description: Direction to order zones.
      - name: match
        type: string
        enum:
          - any
          - all
        required: false
        location: query
        description: Whether to match all search requirements or at least one (any).
  - name: get zone
    description: Zone Details
    method: GET
    url: https://api.cloudflare.com/client/v4/zones/{zone_id}
    read_only: true
    params:
      - name: zone_id
        type: string
        required: true
        location: path
        description: Identifier
  - name: list zone settings
    description: Get all zone settings
    method: GET
    url: https://api.cloudflare.com/client/v4/zones/{zone_id}/settings
    read_only: true
    params:
      - name: zone_id
        type: string
        required: true
        location: path
        description: Identifier
  - name: get zone setting
    description: Get zone setting
    method: GET
    url: https://api.cloudflare.com/client/v4/zones/{zone_id}/settings/{setting_id}
    read_only: true
    params:
      - name: zone_id
        type: string
        required: true
        location: path
        description: Identifier
      - name: setting_id
        type: string
        required: true
        location: path
        description: Setting name
  - name: list zone plans
    description: List Available Plans
    method: GET
    url: https://api.cloudflare.com/client/v4/zones/{zone_id}/available_plans
    read_only: true
    params:
      - name: zone_id
        type: string
        required: true
        location: path
        description: Identifier
  - name: list dns records
    description: List DNS records for a zone.
    method: GET
    url: https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records
    read_only: true
    params:
      - name: zone_id
        type: string
        required: true
        location: path
        description: Identifier.
      - name: name
        type: string
        required: false
        location: query
        description: Exact value of the DNS record name. This is a convenience alias for `name.exact`.
      - name: name.exact
        type: string
        required: false
        location: query
        description: Exact value of the DNS record name. Name filters are case-insensitive.
      - name: name.contains
        type: string
        required: false
        location: query
        description: Substring of the DNS record name. Name filters are case-insensitive.
      - name: name.startswith
        type: string
        required: false
        location: query
        description: Prefix of the DNS record name. Name filters are case-insensitive.
      - name: name.endswith
        type: string
        required: false
        location: query
        description: Suffix of the DNS record name. Name filters are case-insensitive.
      - name: type
        type: string
        enum:
          - A
          - AAAA
          - CAA
          - CERT
          - CNAME
          - DNSKEY
          - DS
          - HTTPS
          - LOC
          - MX
          - NAPTR
          - NS
          - OPENPGPKEY
          - PTR
          - SMIMEA
          - SRV
          - SSHFP
          - SVCB
          - TLSA
          - TXT
          - URI
        required: false
        location: query
        description: Record type.
      - name: content
        type: string
        required: false
        location: query
        description: Exact value of the DNS record content. This is a convenience alias for `content.exact`.
      - name: content.exact
        type: string
        required: false
        location: query
        description: Exact value of the DNS record content. Content filters are case-insensitive.
      - name: content.contains
        type: string
        required: false
        location: query
        description: Substring of the DNS record content. Content filters are case-insensitive.
      - name: content.startswith
        type: string
        required: false
        location: query
        description: Prefix of the DNS record content. Content filters are case-insensitive.
      - name: content.endswith
        type: string
        required: false
        location: query
        description: Suffix of the DNS record content. Content filters are case-insensitive.
      - name: proxied
        type: boolean
        required: false
        location: query
        description: Whether the record is receiving the performance and security benefits of Cloudflare.
      - name: match
        type: string
        enum:
          - any
          - all
        required: false
        location: query
        description: Whether to match all search requirements or at least one (any). If set to `all`, acts
          like a logical AND between filters. If set to `any`, acts like a logical OR instead. Note
          that the interaction bet
      - name: comment
        type: string
        required: false
        location: query
        description: Exact value of the DNS record comment. This is a convenience alias for `comment.exact`.
      - name: comment.present
        type: string
        required: false
        location: query
        description: If this parameter is present, only records *with* a comment are returned.
      - name: comment.absent
        type: string
        required: false
        location: query
        description: If this parameter is present, only records *without* a comment are returned.
      - name: comment.exact
        type: string
        required: false
        location: query
        description: Exact value of the DNS record comment. Comment filters are case-insensitive.
      - name: comment.contains
        type: string
        required: false
        location: query
        description: Substring of the DNS record comment. Comment filters are case-insensitive.
      - name: comment.startswith
        type: string
        required: false
        location: query
        description: Prefix of the DNS record comment. Comment filters are case-insensitive.
      - name: comment.endswith
        type: string
        required: false
        location: query
        description: Suffix of the DNS record comment. Comment filters are case-insensitive.
      - name: tag
        type: string
        required: false
        location: query
        description: >-
          Condition on the DNS record tag.


          Parameter values can be of the form `<tag-name>:<tag-value>` to search for an exact
          `name:value` pair, or just `<tag-name>` to search for records with a specific tag 
      - name: tag.present
        type: string
        required: false
        location: query
        description: Name of a tag which must be present on the DNS record. Tag filters are case-insensitive.
      - name: tag.absent
        type: string
        required: false
        location: query
        description: Name of a tag which must *not* be present on the DNS record. Tag filters are
          case-insensitive.
      - name: tag.exact
        type: string
        required: false
        location: query
        description: A tag and value, of the form `<tag-name>:<tag-value>`. The API will only return DNS
          records that have a tag named `<tag-name>` whose value is `<tag-value>`. Tag filters are
          case-insensitive.
      - name: tag.contains
        type: string
        required: false
        location: query
        description: A tag and value, of the form `<tag-name>:<tag-value>`. The API will only return DNS
          records that have a tag named `<tag-name>` whose value contains `<tag-value>`. Tag filters
          are case-insensitive.
      - name: tag.startswith
        type: string
        required: false
        location: query
        description: A tag and value, of the form `<tag-name>:<tag-value>`. The API will only return DNS
          records that have a tag named `<tag-name>` whose value starts with `<tag-value>`. Tag
          filters are case-insensitive.
      - name: tag.endswith
        type: string
        required: false
        location: query
        description: A tag and value, of the form `<tag-name>:<tag-value>`. The API will only return DNS
          records that have a tag named `<tag-name>` whose value ends with `<tag-value>`. Tag
          filters are case-insensitive.
      - name: search
        type: string
        required: false
        location: query
        description: "Allows searching in multiple properties of a DNS record simultaneously. This parameter
          is intended for human users, not automation. Its exact behavior is intentionally left
          unspecified and is subject "
      - name: tag_match
        type: string
        enum:
          - any
          - all
        required: false
        location: query
        description: Whether to match all tag search requirements or at least one (any). If set to `all`,
          acts like a logical AND between tag filters. If set to `any`, acts like a logical OR
          instead. Note that the regular
      - name: page
        type: number
        required: false
        location: query
        description: Page number of paginated results.
      - name: per_page
        type: number
        required: false
        location: query
        description: Number of DNS records per page.
      - name: order
        type: string
        enum:
          - type
          - name
          - content
          - ttl
          - proxied
        required: false
        location: query
        description: Field to order DNS records by.
      - name: direction
        type: string
        enum:
          - asc
          - desc
        required: false
        location: query
        description: Direction to order DNS records in.
      - name: include_shadow_metadata
        type: boolean
        required: false
        location: query
        description: Whether to include shadow metadata in the `meta` field of each record in the response.
          See [Shadowed
          records](https://developers.cloudflare.com/dns/manage-dns-records/reference/shadowed-records).
      - name: shadowed_by_name
        type: string
        required: false
        location: query
        description: Filters to records at or below the given NS delegation name, excluding the NS records
          that form the delegation itself. The value must be a subdomain of the zone; the zone apex
          is not accepted. Require
      - name: shadowing_name
        type: string
        required: false
        location: query
        description: Returns NS records that shadow the given name, searching at the name itself and each of
          its ancestor names within the zone, excluding the zone apex. The value must be a subdomain
          of the zone; the zone
  - name: get dns record
    description: DNS Record Details
    method: GET
    url: https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records/{dns_record_id}
    read_only: true
    params:
      - name: dns_record_id
        type: string
        required: true
        location: path
        description: Identifier.
      - name: zone_id
        type: string
        required: true
        location: path
        description: Identifier.
      - name: include_shadow_metadata
        type: boolean
        required: false
        location: query
        description: Whether to include shadow metadata in the `meta` field of each record in the response.
          See [Shadowed
          records](https://developers.cloudflare.com/dns/manage-dns-records/reference/shadowed-records).
  - name: get zone dns settings
    description: Show the zone's DNS settings (nameservers, flattening, multi-provider).
    method: GET
    url: https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_settings
    read_only: true
    params:
      - name: zone_id
        type: string
        required: true
        location: path
        description: Identifier.
  - name: get account dns settings
    description: Show the account's default DNS settings for new zones.
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/dns_settings
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
        description: Identifier.
  - name: get dns analytics report
    description: DNS query analytics for a zone, aggregated over the period as a table.
    method: GET
    url: https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_analytics/report
    read_only: true
    params:
      - name: zone_id
        type: string
        required: true
        location: path
        description: Identifier.
      - name: metrics
        type: string
        required: false
        location: query
        description: A comma-separated list of metrics to query.
      - name: dimensions
        type: string
        required: false
        location: query
        description: A comma-separated list of dimensions to group results by.
      - name: since
        type: string
        format: date-time
        required: false
        location: query
        description: Start date and time of requesting data period in ISO 8601 format.
      - name: until
        type: string
        format: date-time
        required: false
        location: query
        description: End date and time of requesting data period in ISO 8601 format.
      - name: limit
        type: integer
        required: false
        location: query
        description: Limit number of returned metrics.
      - name: sort
        type: string
        required: false
        location: query
        description: A comma-separated list of dimensions to sort by, where each dimension may be prefixed
          by - (descending) or + (ascending).
      - name: filters
        type: string
        required: false
        location: query
        description: Segmentation filter in 'attribute operator value' format.
  - name: get dns analytics report by time
    description: DNS query analytics for a zone, bucketed into a time series.
    method: GET
    url: https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_analytics/report/bytime
    read_only: true
    params:
      - name: zone_id
        type: string
        required: true
        location: path
        description: Identifier.
      - name: metrics
        type: string
        required: false
        location: query
        description: A comma-separated list of metrics to query.
      - name: dimensions
        type: string
        required: false
        location: query
        description: A comma-separated list of dimensions to group results by.
      - name: since
        type: string
        format: date-time
        required: false
        location: query
        description: Start date and time of requesting data period in ISO 8601 format.
      - name: until
        type: string
        format: date-time
        required: false
        location: query
        description: End date and time of requesting data period in ISO 8601 format.
      - name: limit
        type: integer
        required: false
        location: query
        description: Limit number of returned metrics.
      - name: sort
        type: string
        required: false
        location: query
        description: A comma-separated list of dimensions to sort by, where each dimension may be prefixed
          by - (descending) or + (ascending).
      - name: filters
        type: string
        required: false
        location: query
        description: Segmentation filter in 'attribute operator value' format.
      - name: time_delta
        type: string
        enum:
          - all
          - auto
          - year
          - quarter
          - month
          - week
          - day
          - hour
          - dekaminute
          - minute
        required: false
        location: query
        description: Unit of time to group data by.
  - name: list workers
    description: List Workers
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/workers/scripts
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
        description: Identifier.
      - name: tags
        type: string
        required: false
        location: query
        description: "Filter scripts by tags. Format: comma-separated list of tag:allowed pairs where
          allowed is 'yes' or 'no'."
  - name: download worker script
    description: Fetch a Worker script's source. Returns the raw JavaScript module text, NOT JSON — no
      success/result envelope — and long scripts are truncated in chat, so use it to inspect a
      specific Worker, not to copy one wholesale.
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/workers/scripts/{script_name}
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
        description: Identifier.
      - name: script_name
        type: string
        required: true
        location: path
        description: Name of the script, used in URLs and route configuration.
  - name: get worker settings
    description: Get a Worker script's settings — bindings, compatibility date, and tags.
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/workers/scripts/{script_name}/settings
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
        description: Identifier.
      - name: script_name
        type: string
        required: true
        location: path
        description: Name of the script, used in URLs and route configuration.
  - name: list worker domains
    description: List the custom domains attached to Workers on the account.
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/workers/domains
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
        description: Identifier.
      - name: zone_id
        type: string
        required: false
        location: query
        description: ID of the zone containing the domain hostname.
      - name: zone_name
        type: string
        required: false
        location: query
        description: Name of the zone containing the domain hostname.
      - name: service
        type: string
        required: false
        location: query
        description: Name of the Worker associated with the domain.
      - name: hostname
        type: string
        required: false
        location: query
        description: Hostname of the domain.
      - name: environment
        type: string
        required: false
        location: query
        description: Worker environment associated with the domain.
  - name: get workers subdomain
    description: Get the account's workers.dev subdomain.
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/workers/subdomain
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
        description: Identifier.
  - name: list worker routes
    description: List the route patterns that map zone URLs to Worker scripts.
    method: GET
    url: https://api.cloudflare.com/client/v4/zones/{zone_id}/workers/routes
    read_only: true
    params:
      - name: zone_id
        type: string
        required: true
        location: path
        description: Identifier.
  - name: get worker route
    description: Get one route pattern that maps zone URLs to a Worker script.
    method: GET
    url: https://api.cloudflare.com/client/v4/zones/{zone_id}/workers/routes/{route_id}
    read_only: true
    params:
      - name: route_id
        type: string
        required: true
        location: path
        description: Identifier.
      - name: zone_id
        type: string
        required: true
        location: path
        description: Identifier.
  - name: list kv namespaces
    description: List Workers KV namespaces on the account.
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/storage/kv/namespaces
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
        description: Identifier.
      - name: page
        type: number
        required: false
        location: query
        description: Page number of paginated results.
      - name: per_page
        type: number
        required: false
        location: query
        description: Maximum number of results per page.
      - name: order
        type: string
        enum:
          - id
          - title
        required: false
        location: query
        description: Field to order results by.
      - name: direction
        type: string
        enum:
          - asc
          - desc
        required: false
        location: query
        description: Direction to order namespaces.
  - name: get kv namespace
    description: Get one Workers KV namespace.
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/storage/kv/namespaces/{namespace_id}
    read_only: true
    params:
      - name: namespace_id
        type: string
        required: true
        location: path
        description: Namespace identifier tag.
      - name: account_id
        type: string
        required: true
        location: path
