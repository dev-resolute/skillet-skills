slug: cloudflare
version: 1.1.0
name: Cloudflare
category: infra-cloud
one_liner: Read zones, DNS, Workers, storage, and logs on Cloudflare, and purge cache.
api_domain: api.cloudflare.com
status: live
credentials:
  - env_var: CLOUDFLARE_API_TOKEN
    label: Cloudflare API token
    help_url: https://developers.cloudflare.com/fundamentals/api/get-started/create-token/
auth:
  scheme: bearer
  header: Authorization
  env_vars:
    - CLOUDFLARE_API_TOKEN
  value_template: Bearer ${CLOUDFLARE_API_TOKEN}
operations:
  - name: get current user
    description: User Details
    method: GET
    url: https://api.cloudflare.com/client/v4/user
    read_only: true
    params: []
  - name: verify api token
    description: Verify Token
    method: GET
    url: https://api.cloudflare.com/client/v4/user/tokens/verify
    read_only: true
    params: []
  - name: list accounts
    description: List Accounts
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts
    read_only: true
    params:
      - name: name
        type: string
        required: false
        location: query
      - name: page
        type: number
        required: false
        location: query
      - name: per_page
        type: number
        required: false
        location: query
      - name: direction
        type: string
        enum:
          - asc
          - desc
        required: false
        location: query
  - name: get account
    description: Account Details
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
  - name: list account members
    description: List Members
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/members
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
      - name: order
        type: string
        enum:
          - user.first_name
          - user.last_name
          - user.email
          - status
        required: false
        location: query
      - name: status
        type: string
        enum:
          - accepted
          - pending
          - rejected
        required: false
        location: query
      - name: page
        type: number
        required: false
        location: query
      - name: per_page
        type: number
        required: false
        location: query
      - name: direction
        type: string
        enum:
          - asc
          - desc
        required: false
        location: query
  - name: list account roles
    description: List Roles
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/roles
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
      - name: page
        type: number
        required: false
        location: query
      - name: per_page
        type: number
        required: false
        location: query
  - name: list account api tokens
    description: List Tokens
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/tokens
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
      - name: page
        type: number
        required: false
        location: query
      - name: per_page
        type: number
        required: false
        location: query
      - name: direction
        type: string
        enum:
          - asc
          - desc
        required: false
        location: query
      - name: include_expired
        type: boolean
        required: false
        location: query
        description: When true, includes recently-expired tokens in the response.
  - name: list zones
    description: List zones on the account.
    method: GET
    url: https://api.cloudflare.com/client/v4/zones
    read_only: true
    params:
      - name: name
        type: string
        required: false
        location: query
      - name: status
        type: string
        enum:
          - initializing
          - pending
          - active
          - moved
        required: false
        location: query
      - name: type
        type: array
        items_type: string
        enum:
          - full
          - partial
          - secondary
          - internal
        required: false
        location: query
      - name: account.id
        type: string
        required: false
        location: query
      - name: account.name
        type: string
        required: false
        location: query
      - name: page
        type: number
        required: false
        location: query
      - name: per_page
        type: number
        required: false
        location: query
      - name: order
        type: string
        enum:
          - name
          - status
          - account.id
          - account.name
          - plan.id
        required: false
        location: query
      - name: direction
        type: string
        enum:
          - asc
          - desc
        required: false
        location: query
      - name: match
        type: string
        enum:
          - any
          - all
        required: false
        location: query
  - name: get zone
    description: Zone Details
    method: GET
    url: https://api.cloudflare.com/client/v4/zones/{zone_id}
    read_only: true
    params:
      - name: zone_id
        type: string
        required: true
        location: path
  - name: list zone settings
    description: Get all zone settings
    method: GET
    url: https://api.cloudflare.com/client/v4/zones/{zone_id}/settings
    read_only: true
    params:
      - name: zone_id
        type: string
        required: true
        location: path
  - name: get zone setting
    description: Get zone setting
    method: GET
    url: https://api.cloudflare.com/client/v4/zones/{zone_id}/settings/{setting_id}
    read_only: true
    params:
      - name: zone_id
        type: string
        required: true
        location: path
      - name: setting_id
        type: string
        required: true
        location: path
  - name: list zone plans
    description: List Available Plans
    method: GET
    url: https://api.cloudflare.com/client/v4/zones/{zone_id}/available_plans
    read_only: true
    params:
      - name: zone_id
        type: string
        required: true
        location: path
  - name: list dns records
    description: List DNS records for a zone.
    method: GET
    url: https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records
    read_only: true
    params:
      - name: zone_id
        type: string
        required: true
        location: path
      - name: name
        type: string
        required: false
        location: query
      - name: name.exact
        type: string
        required: false
        location: query
      - name: name.contains
        type: string
        required: false
        location: query
      - name: name.startswith
        type: string
        required: false
        location: query
      - name: name.endswith
        type: string
        required: false
        location: query
      - name: type
        type: string
        enum:
          - A
          - AAAA
          - CAA
          - CERT
          - CNAME
          - DNSKEY
          - DS
          - HTTPS
          - LOC
          - MX
          - NAPTR
          - NS
          - OPENPGPKEY
          - PTR
          - SMIMEA
          - SRV
          - SSHFP
          - SVCB
          - TLSA
          - TXT
          - URI
        required: false
        location: query
      - name: content
        type: string
        required: false
        location: query
      - name: content.exact
        type: string
        required: false
        location: query
      - name: content.contains
        type: string
        required: false
        location: query
      - name: content.startswith
        type: string
        required: false
        location: query
      - name: content.endswith
        type: string
        required: false
        location: query
      - name: proxied
        type: boolean
        required: false
        location: query
      - name: match
        type: string
        enum:
          - any
          - all
        required: false
        location: query
      - name: comment
        type: string
        required: false
        location: query
      - name: comment.present
        type: string
        required: false
        location: query
      - name: comment.absent
        type: string
        required: false
        location: query
      - name: comment.exact
        type: string
        required: false
        location: query
      - name: comment.contains
        type: string
        required: false
        location: query
      - name: comment.startswith
        type: string
        required: false
        location: query
      - name: comment.endswith
        type: string
        required: false
        location: query
      - name: tag
        type: string
        required: false
        location: query
      - name: tag.present
        type: string
        required: false
        location: query
      - name: tag.absent
        type: string
        required: false
        location: query
      - name: tag.exact
        type: string
        required: false
        location: query
      - name: tag.contains
        type: string
        required: false
        location: query
      - name: tag.startswith
        type: string
        required: false
        location: query
      - name: tag.endswith
        type: string
        required: false
        location: query
      - name: search
        type: string
        required: false
        location: query
      - name: tag_match
        type: string
        enum:
          - any
          - all
        required: false
        location: query
      - name: page
        type: number
        required: false
        location: query
      - name: per_page
        type: number
        required: false
        location: query
      - name: order
        type: string
        enum:
          - type
          - name
          - content
          - ttl
          - proxied
        required: false
        location: query
      - name: direction
        type: string
        enum:
          - asc
          - desc
        required: false
        location: query
      - name: include_shadow_metadata
        type: boolean
        required: false
        location: query
      - name: shadowed_by_name
        type: string
        required: false
        location: query
      - name: shadowing_name
        type: string
        required: false
        location: query
  - name: get dns record
    description: DNS Record Details
    method: GET
    url: https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records/{dns_record_id}
    read_only: true
    params:
      - name: dns_record_id
        type: string
        required: true
        location: path
      - name: zone_id
        type: string
        required: true
        location: path
      - name: include_shadow_metadata
        type: boolean
        required: false
        location: query
  - name: get zone dns settings
    description: Show the zone's DNS settings (nameservers, flattening, multi-provider).
    method: GET
    url: https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_settings
    read_only: true
    params:
      - name: zone_id
        type: string
        required: true
        location: path
  - name: get account dns settings
    description: Show the account's default DNS settings for new zones.
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/dns_settings
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
  - name: get dns analytics report
    description: DNS query analytics for a zone, aggregated over the period as a table.
    method: GET
    url: https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_analytics/report
    read_only: true
    params:
      - name: zone_id
        type: string
        required: true
        location: path
      - name: metrics
        type: string
        required: false
        location: query
      - name: dimensions
        type: string
        required: false
        location: query
      - name: since
        type: string
        format: date-time
        required: false
        location: query
      - name: until
        type: string
        format: date-time
        required: false
        location: query
      - name: limit
        type: integer
        required: false
        location: query
      - name: sort
        type: string
        required: false
        location: query
      - name: filters
        type: string
        required: false
        location: query
  - name: get dns analytics report by time
    description: DNS query analytics for a zone, bucketed into a time series.
    method: GET
    url: https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_analytics/report/bytime
    read_only: true
    params:
      - name: zone_id
        type: string
        required: true
        location: path
      - name: metrics
        type: string
        required: false
        location: query
      - name: dimensions
        type: string
        required: false
        location: query
      - name: since
        type: string
        format: date-time
        required: false
        location: query
      - name: until
        type: string
        format: date-time
        required: false
        location: query
      - name: limit
        type: integer
        required: false
        location: query
      - name: sort
        type: string
        required: false
        location: query
      - name: filters
        type: string
        required: false
        location: query
      - name: time_delta
        type: string
        enum:
          - all
          - auto
          - year
          - quarter
          - month
          - week
          - day
          - hour
          - dekaminute
          - minute
        required: false
        location: query
  - name: list workers
    description: List Workers
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/workers/scripts
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
      - name: tags
        type: string
        required: false
        location: query
        description: "Filter scripts by tags. Format: comma-separated list of tag:allowed pairs where
          allowed is 'yes' or 'no'."
  - name: download worker script
    description: Download Worker
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/workers/scripts/{script_name}
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
      - name: script_name
        type: string
        required: true
        location: path
  - name: get worker settings
    description: Get a Worker script's settings — bindings, compatibility date, and tags.
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/workers/scripts/{script_name}/settings
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
      - name: script_name
        type: string
        required: true
        location: path
  - name: list worker domains
    description: List the custom domains attached to Workers on the account.
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/workers/domains
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
      - name: zone_id
        type: string
        required: false
        location: query
      - name: zone_name
        type: string
        required: false
        location: query
      - name: service
        type: string
        required: false
        location: query
      - name: hostname
        type: string
        required: false
        location: query
      - name: environment
        type: string
        required: false
        location: query
  - name: get workers subdomain
    description: Get the account's workers.dev subdomain.
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/workers/subdomain
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
  - name: list worker routes
    description: List the route patterns that map zone URLs to Worker scripts.
    method: GET
    url: https://api.cloudflare.com/client/v4/zones/{zone_id}/workers/routes
    read_only: true
    params:
      - name: zone_id
        type: string
        required: true
        location: path
  - name: get worker route
    description: Get one route pattern that maps zone URLs to a Worker script.
    method: GET
    url: https://api.cloudflare.com/client/v4/zones/{zone_id}/workers/routes/{route_id}
    read_only: true
    params:
      - name: route_id
        type: string
        required: true
        location: path
      - name: zone_id
        type: string
        required: true
        location: path
  - name: list kv namespaces
    description: List Workers KV namespaces on the account.
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/storage/kv/namespaces
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
      - name: page
        type: number
        required: false
        location: query
      - name: per_page
        type: number
        required: false
        location: query
      - name: order
        type: string
        enum:
          - id
          - title
        required: false
        location: query
      - name: direction
        type: string
        enum:
          - asc
          - desc
        required: false
        location: query
  - name: get kv namespace
    description: Get one Workers KV namespace.
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/storage/kv/namespaces/{namespace_id}
    read_only: true
    params:
      - name: namespace_id
        type: string
        required: true
        location: path
      - name: account_id
        type: string
        required: true
        location: path
  - name: list kv keys
    description: List the keys stored in a Workers KV namespace.
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/storage/kv/namespaces/{namespace_id}/keys
    read_only: true
    params:
      - name: namespace_id
        type: string
        required: true
        location: path
      - name: account_id
        type: string
        required: true
        location: path
      - name: limit
        type: number
        required: false
        location: query
      - name: prefix
        type: string
        required: false
        location: query
      - name: cursor
        type: string
        required: false
        location: query
  - name: list r2 buckets
    description: List R2 object-storage buckets on the account.
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/r2/buckets
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
      - name: name_contains
        type: string
        required: false
        location: query
      - name: start_after
        type: string
        required: false
        location: query
      - name: per_page
        type: number
        required: false
        location: query
      - name: order
        type: string
        enum:
          - name
        required: false
        location: query
      - name: direction
        type: string
        enum:
          - asc
          - desc
        required: false
        location: query
      - name: cursor
        type: string
        required: false
        location: query
      - name: cf-r2-jurisdiction
        type: string
        enum:
          - default
          - eu
          - fedramp
        required: false
        location: header
  - name: get r2 bucket
    description: Get one R2 object-storage bucket.
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/r2/buckets/{bucket_name}
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
      - name: bucket_name
        type: string
        required: true
        location: path
      - name: cf-r2-jurisdiction
        type: string
        enum:
          - default
          - eu
          - fedramp
        required: false
        location: header
  - name: list d1 databases
    description: List D1 Databases
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/d1/database
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
      - name: name
        type: string
        required: false
        location: query
      - name: page
        type: number
        required: false
        location: query
      - name: per_page
        type: number
        required: false
        location: query
  - name: get d1 database
    description: Get D1 Database
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/d1/database/{database_id}
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
      - name: database_id
        type: string
        required: true
        location: path
      - name: fields
        type: array
        items_type: string
        enum:
          - uuid
          - name
          - created_at
          - version
          - jurisdiction
          - num_tables
          - file_size
          - running_in_region
          - read_replication
        required: false
        location: query
        description: |-
          Comma-separated list of fields to include in the response. When omitted,
          all fields are returned.
  - name: list hyperdrive configs
    description: List Hyperdrives
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/hyperdrive/configs
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
        description: The Cloudflare account ID.
      - name: page
        type: integer
        required: false
        location: query
        description: Page number of paginated results.
      - name: per_page
        type: integer
        required: false
        location: query
        description: Maximum number of results per page.
  - name: get hyperdrive config
    description: Get Hyperdrive
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/hyperdrive/configs/{hyperdrive_id}
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
        description: The Cloudflare account ID.
      - name: hyperdrive_id
        type: string
        required: true
        location: path
        description: The unique identifier of the Hyperdrive configuration.
  - name: list queues
    description: List Queues
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/queues
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
  - name: get queue
    description: Get Queue
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/queues/{queue_id}
    read_only: true
    params:
      - name: queue_id
        type: string
        required: true
        location: path
      - name: account_id
        type: string
        required: true
        location: path
  - name: list pages projects
    description: List Cloudflare Pages projects on the account.
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/pages/projects
    read_only: true
    params:
      - name: account_id
        type: string
        required: true
        location: path
      - name: page
        type: integer
        required: false
        location: query
      - name: per_page
        type: integer
        required: false
        location: query
  - name: get pages project
    description: Get one Cloudflare Pages project.
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/pages/projects/{project_name}
    read_only: true
    params:
      - name: project_name
        type: string
        required: true
        location: path
      - name: account_id
        type: string
        required: true
        location: path
  - name: list pages deployments
    description: List the deployments of a Cloudflare Pages project.
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/pages/projects/{project_name}/deployments
    read_only: true
    params:
      - name: project_name
        type: string
        required: true
        location: path
      - name: account_id
        type: string
        required: true
        location: path
      - name: env
        type: string
        enum:
          - production
          - preview
        required: false
        location: query
      - name: page
        type: integer
        required: false
        location: query
      - name: per_page
        type: integer
        required: false
        location: query
  - name: get pages deployment
    description: Get one deployment of a Cloudflare Pages project.
    method: GET
    url: https://api.cloudflare.com/client/v4/accounts/{account_id}/pages/projects/{project_name}/deployments/{deployment_id}
    read_only: true
    params:
      - name: deployment_id
        type: string
        required: true
        location: path
      - name: project_name
        type: string
        required: true
        location: path
      - name: account_id
        type: string
        required: true
        location: path
  - name: list ai gateways
    description: List Gateways
