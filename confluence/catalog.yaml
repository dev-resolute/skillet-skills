        format: int64
        required: true
        location: path
        description: The ID of the page.
      - name: limit
        type: integer
        format: int32
        required: false
        location: query
        description: Maximum number of items per result to return. If more results exist, call the endpoint
          with the cursor to fetch the next set of results.
      - name: depth
        type: integer
        format: int32
        required: false
        location: query
        description: Maximum depth of descendants to return. If more results are required, use the endpoint
          corresponding to the content type of the deepest descendant to fetch more descendants.
      - name: cursor
        type: string
        required: false
        location: query
        description: Used for pagination, this opaque cursor will be returned in the `next` URL in the
          `Link` response header. Use the relative URL in the `Link` header to retrieve the `next`
