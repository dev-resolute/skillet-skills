slug: confluence
version: 1.1.0
name: Confluence
category: work-project
one_liner: Search and read pages, spaces, and comments in Confluence — and create pages.
api_domain: atlassian.net
status: live
credentials:
  - env_var: CONFLUENCE_EMAIL
    label: Atlassian account email
    help_url: https://support.atlassian.com/atlassian-account/docs/manage-api-tokens-for-your-atlassian-account/
  - env_var: CONFLUENCE_API_TOKEN
    label: Confluence API token
    help_url: https://support.atlassian.com/atlassian-account/docs/manage-api-tokens-for-your-atlassian-account/
auth:
  scheme: basic
  header: Authorization
  env_vars:
    - CONFLUENCE_EMAIL
    - CONFLUENCE_API_TOKEN
  value_template: Basic ${base64(CONFLUENCE_EMAIL:CONFLUENCE_API_TOKEN)}
operations:
  - name: list pages
    description: Get pages
    method: GET
    url: https://{base_url}/wiki/api/v2/pages
    read_only: true
    params:
      - name: id
        type: array
        items_type: integer
        required: false
        location: query
        description: Filter the results based on page ids. Multiple page ids can be specified as a
          comma-separated list.
      - name: space-id
        type: array
        items_type: integer
        required: false
        location: query
        description: Filter the results based on space ids. Multiple space ids can be specified as a
          comma-separated list.
      - name: sort
        type: string
        enum:
          - id
          - -id
          - created-date
          - -created-date
          - modified-date
          - -modified-date
          - title
          - -title
        required: false
        location: query
        description: Used to sort the result by a particular field.
      - name: status
        type: array
        items_type: string
        enum:
          - current
          - archived
          - deleted
          - trashed
        required: false
        location: query
        description: Filter the results to pages based on their status. By default, `current` and `archived`
          are used.
      - name: title
        type: string
        required: false
        location: query
        description: Filter the results to pages based on their title.
      - name: body-format
        type: string
        enum:
          - storage
          - atlas_doc_format
        required: false
        location: query
        description: The content format types to be returned in the `body` field of the response. If
          available, the representation will be available under a response field of the same name
          under the `body` field.
      - name: subtype
        type: string
        enum:
          - live
          - page
        required: false
        location: query
        description: Filter the results to pages based on their subtype.
      - name: cursor
        type: string
        required: false
        location: query
        description: Used for pagination, this opaque cursor will be returned in the `next` URL in the
          `Link` response header. Use the relative URL in the `Link` header to retrieve the `next`
          set of results.
      - name: limit
        type: integer
        format: int32
        required: false
        location: query
        description: Maximum number of pages per result to return. If more results exist, use the `Link`
          header to retrieve a relative URL that will return the next set of results.
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: get page
    description: Fetch one page by id.
    method: GET
    url: https://{base_url}/wiki/api/v2/pages/{id}
    read_only: true
    params:
      - name: id
        type: integer
        format: int64
        required: true
        location: path
        description: The ID of the page to be returned. If you don't know the page ID, use Get pages and
          filter the results.
      - name: body-format
        type: string
        enum:
          - storage
          - atlas_doc_format
          - view
          - export_view
          - anonymous_export_view
          - styled_view
          - editor
        required: false
        location: query
        description: The content format types to be returned in the `body` field of the response. If
          available, the representation will be available under a response field of the same name
          under the `body` field.
      - name: get-draft
        type: boolean
        required: false
        location: query
        description: Retrieve the draft version of this page.
      - name: status
        type: array
        items_type: string
        enum:
          - current
          - archived
          - trashed
          - deleted
          - historical
          - draft
        required: false
        location: query
        description: Filter the page being retrieved by its status.
      - name: version
        type: integer
        required: false
        location: query
        description: Allows you to retrieve a previously published version. Specify the previous version's
          number to retrieve its details.
      - name: include-labels
        type: boolean
        required: false
        location: query
        description: |-
          Includes labels associated with this page in the response.
          The number of results will be limited to 50 and sorted in the default sort order. 
          A `meta` and `_links` property will be present to indicate
      - name: include-properties
        type: boolean
        required: false
        location: query
        description: |-
          Includes content properties associated with this page in the response.
          The number of results will be limited to 50 and sorted in the default sort order. 
          A `meta` and `_links` property will be present
      - name: include-operations
        type: boolean
        required: false
        location: query
        description: >-
          Includes operations associated with this page in the response, as defined in the
          `Operation` object.

          The number of results will be limited to 50 and sorted in the default sort order. 

          A `meta` and `_l
      - name: include-likes
        type: boolean
        required: false
        location: query
        description: |-
          Includes likes associated with this page in the response.
          The number of results will be limited to 50 and sorted in the default sort order. 
          A `meta` and `_links` property will be present to indicate 
      - name: include-versions
        type: boolean
        required: false
        location: query
        description: |-
          Includes versions associated with this page in the response.
          The number of results will be limited to 50 and sorted in the default sort order. 
          A `meta` and `_links` property will be present to indica
      - name: include-version
        type: boolean
        required: false
        location: query
        description: |-
          Includes the current version associated with this page in the response.
          By default this is included and can be omitted by setting the value to `false`.
      - name: include-favorited-by-current-user-status
        type: boolean
        required: false
        location: query
        description: Includes whether this page has been favorited by the current user.
      - name: include-webresources
        type: boolean
        required: false
        location: query
        description: Includes web resources that can be used to render page content on a client.
      - name: include-collaborators
        type: boolean
        required: false
        location: query
        description: Includes collaborators on the page.
      - name: include-direct-children
        type: boolean
        required: false
        location: query
        description: Includes direct children of the page, as defined in the `ChildrenResponse` object.
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: list page ancestors
    description: Get all ancestors of page
    method: GET
    url: https://{base_url}/wiki/api/v2/pages/{id}/ancestors
    read_only: true
    params:
      - name: id
        type: integer
        format: int64
        required: true
        location: path
        description: The ID of the page.
      - name: limit
        type: integer
        format: int32
        required: false
        location: query
        description: Maximum number of pages per result to return. If more results exist, call this endpoint
          with the highest ancestor's ID to fetch the next set of results.
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: list page descendants
