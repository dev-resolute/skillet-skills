slug: jira
version: 1.1.0
name: Jira
category: work-project
one_liner: Search and read issues, projects, and people in Jira — and create issues.
api_domain: atlassian.net
status: live
credentials:
  - env_var: JIRA_EMAIL
    label: Atlassian account email
    help_url: https://support.atlassian.com/atlassian-account/docs/manage-api-tokens-for-your-atlassian-account/
  - env_var: JIRA_API_TOKEN
    label: Jira API token
    help_url: https://support.atlassian.com/atlassian-account/docs/manage-api-tokens-for-your-atlassian-account/
auth:
  scheme: basic
  header: Authorization
  env_vars:
    - JIRA_EMAIL
    - JIRA_API_TOKEN
  value_template: Basic ${base64(JIRA_EMAIL:JIRA_API_TOKEN)}
operations:
  - name: search issues
    description: Search issues with JQL.
    method: GET
    url: https://{base_url}/rest/api/3/search/jql
    read_only: true
    params:
      - name: jql
        type: string
        required: false
        location: query
        description: >-
          A [JQL](https://confluence.atlassian.com/x/egORLQ) expression. For performance reasons,
          this parameter requires a bounded query. A bounded query is a query with a search
          restriction.

           *  Example of a
      - name: nextPageToken
        type: string
        required: false
        location: query
        description: >-
          The token for a page to fetch that is not the first page. The first page has a
          `nextPageToken` of `null`. Use the `nextPageToken` to fetch the next page of issues.


          Note: The `nextPageToken` field is 
      - name: maxResults
        type: integer
        format: int32
        required: false
        location: query
        description: The maximum number of items to return per page. To manage page size, API may return
          fewer items per page where a large number of fields or properties are requested. The
          greatest number of items return
      - name: fields
        type: array
        items_type: string
        required: false
        location: query
        description: >-
          A list of fields to return for each issue, use it to retrieve a subset of fields. This
          parameter accepts a comma-separated list. Expand options include:

           *  `*all` Returns all fields.
           *  `*navigable
      - name: expand
        type: string
        required: false
        location: query
        description: Use [expand](#expansion) to include additional information about issues in the
          response. Note that, unlike the majority of instances where `expand` is specified,
          `expand` is defined as a comma-delimit
      - name: properties
        type: array
        items_type: string
        required: false
        location: query
        description: A list of up to 5 issue properties to include in the results. This parameter accepts a
          comma-separated list.
      - name: fieldsByKeys
        type: boolean
        required: false
        location: query
        description: Reference fields by their key (rather than ID). The default is `false`.
      - name: failFast
        type: boolean
        required: false
        location: query
        description: Fail this request early if we can't retrieve all field data.
      - name: reconcileIssues
        type: array
        items_type: integer
        required: false
        location: query
        description: Strong consistency issue ids to be reconciled with search results. Accepts max 50 ids.
          This list of ids should be consistent with each paginated request across different pages.
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: get issue
    description: Fetch one issue by key.
    method: GET
    url: https://{base_url}/rest/api/3/issue/{issueIdOrKey}
    read_only: true
    params:
      - name: issueIdOrKey
        type: string
        required: true
        location: path
        description: The ID or key of the issue.
      - name: fields
        type: array
        items_type: string
        required: false
        location: query
        description: >-
          A list of fields to return for the issue. This parameter accepts a comma-separated list.
          Use it to retrieve a subset of fields. Allowed values:

           *  `*all` Returns all fields.
           *  `*navigable` Returns
      - name: fieldsByKeys
        type: boolean
        required: false
        location: query
        description: Whether fields in `fields` are referenced by keys rather than IDs. This parameter is
          useful where fields have been added by a connect app and a field's key may differ from its
          ID.
      - name: expand
        type: string
        required: false
        location: query
        description: >-
          Use [expand](#expansion) to include additional information about the issues in the
          response. This parameter accepts a comma-separated list. Expand options include:

           *  `renderedFields` Returns field 
      - name: properties
        type: array
        items_type: string
        required: false
        location: query
        description: >-
          A list of issue properties to return for the issue. This parameter accepts a
          comma-separated list. Allowed values:

           *  `*all` Returns all issue properties.
           *  Any issue property key, prefixed with a
      - name: updateHistory
        type: boolean
        required: false
        location: query
        description: Whether the project in which the issue is created is added to the user's **Recently
          viewed** project list, as shown under **Projects** in Jira. This also populates the [JQL
          issues search](#api-rest-ap
      - name: failFast
        type: boolean
        required: false
        location: query
        description: Whether to fail the request quickly in case of an error while loading fields for an
          issue. For `failFast=true`, if one field fails, the entire operation fails. For
          `failFast=false`, the operation will
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: list issue comments
    description: Get comments
    method: GET
    url: https://{base_url}/rest/api/3/issue/{issueIdOrKey}/comment
    read_only: true
    params:
      - name: issueIdOrKey
        type: string
        required: true
        location: path
        description: The ID or key of the issue.
      - name: startAt
        type: integer
        format: int64
        required: false
        location: query
        description: The index of the first item to return in a page of results (page offset).
      - name: maxResults
        type: integer
        format: int32
        required: false
        location: query
        description: The maximum number of items to return per page.
      - name: orderBy
        type: string
        enum:
          - created
          - -created
          - +created
        required: false
        location: query
        description: "[Order](#ordering) the results by a field. Accepts *created* to sort comments by their
          created date."
      - name: expand
        type: string
        required: false
        location: query
        description: Use [expand](#expansion) to include additional information about comments in the
          response. This parameter accepts `renderedBody`, which returns the comment body rendered
          in HTML.
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: get issue comment
    description: Get comment
    method: GET
    url: https://{base_url}/rest/api/3/issue/{issueIdOrKey}/comment/{id}
    read_only: true
    params:
      - name: issueIdOrKey
        type: string
        required: true
        location: path
        description: The ID or key of the issue.
      - name: id
        type: string
        required: true
        location: path
        description: The ID of the comment.
      - name: expand
        type: string
        required: false
        location: query
        description: Use [expand](#expansion) to include additional information about comments in the
          response. This parameter accepts `renderedBody`, which returns the comment body rendered
          in HTML.
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: list issue changelog
    description: Get changelogs
    method: GET
    url: https://{base_url}/rest/api/3/issue/{issueIdOrKey}/changelog
    read_only: true
    params:
      - name: issueIdOrKey
        type: string
        required: true
        location: path
        description: The ID or key of the issue.
      - name: startAt
        type: integer
        format: int32
        required: false
        location: query
        description: The index of the first item to return in a page of results (page offset).
      - name: maxResults
        type: integer
        format: int32
        required: false
        location: query
        description: The maximum number of items to return per page.
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: list issue transitions
    description: Get transitions
    method: GET
    url: https://{base_url}/rest/api/3/issue/{issueIdOrKey}/transitions
    read_only: true
    params:
      - name: issueIdOrKey
        type: string
        required: true
        location: path
        description: The ID or key of the issue.
      - name: expand
        type: string
        required: false
        location: query
        description: "Use [expand](#expansion) to include additional information about transitions in the
          response. This parameter accepts `transitions.fields`, which returns information about the
          fields in the transition "
      - name: transitionId
        type: string
        required: false
        location: query
        description: The ID of the transition.
      - name: skipRemoteOnlyCondition
        type: boolean
        required: false
        location: query
        description: Whether transitions with the condition *Hide From User Condition* are included in the
          response. Available to Connect and Forge app users with *Administer Jira* [global
          permission](https://confluence.a
      - name: includeUnavailableTransitions
        type: boolean
        required: false
        location: query
        description: Whether details of transitions that fail a condition are included in the response
      - name: sortByOpsBarAndStatus
        type: boolean
        required: false
        location: query
        description: Whether the transitions are sorted by ops-bar sequence value first then category order
          (Todo, In Progress, Done) or only by ops-bar sequence value.
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: list issue worklogs
    description: Get issue worklogs
    method: GET
    url: https://{base_url}/rest/api/3/issue/{issueIdOrKey}/worklog
    read_only: true
    params:
      - name: issueIdOrKey
        type: string
        required: true
        location: path
        description: The ID or key of the issue.
      - name: startAt
        type: integer
        format: int64
        required: false
        location: query
        description: The index of the first item to return in a page of results (page offset).
      - name: maxResults
        type: integer
        format: int32
        required: false
        location: query
        description: The maximum number of items to return per page.
      - name: startedAfter
        type: integer
        format: int64
        required: false
        location: query
        description: The worklog start date and time, as a UNIX timestamp in milliseconds, after which
          worklogs are returned.
      - name: startedBefore
        type: integer
        format: int64
        required: false
        location: query
        description: The worklog start date and time, as a UNIX timestamp in milliseconds, before which
          worklogs are returned.
      - name: expand
        type: string
        required: false
        location: query
        description: Use [expand](#expansion) to include additional information about worklogs in the
          response. This parameter accepts`properties`, which returns worklog properties.
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: list issue watchers
    description: Get issue watchers
    method: GET
    url: https://{base_url}/rest/api/3/issue/{issueIdOrKey}/watchers
    read_only: true
    params:
      - name: issueIdOrKey
        type: string
        required: true
        location: path
        description: The ID or key of the issue.
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: get issue votes
    description: Get votes
    method: GET
    url: https://{base_url}/rest/api/3/issue/{issueIdOrKey}/votes
    read_only: true
    params:
      - name: issueIdOrKey
        type: string
        required: true
        location: path
        description: The ID or key of the issue.
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: get issue edit metadata
    description: Get edit issue metadata
    method: GET
    url: https://{base_url}/rest/api/3/issue/{issueIdOrKey}/editmeta
    read_only: true
    params:
      - name: issueIdOrKey
        type: string
        required: true
        location: path
        description: The ID or key of the issue.
      - name: overrideScreenSecurity
        type: boolean
        required: false
        location: query
        description: Whether hidden fields are returned. Available to Connect and Forge app users with
          *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg) and Forge
          apps acting on behalf of us
      - name: overrideEditableFlag
        type: boolean
        required: false
        location: query
        description: Whether non-editable fields are returned. Available to Connect and Forge app users with
          *Administer Jira* [global permission](https://confluence.atlassian.com/x/x4dKLg) and Forge
          apps acting on behalf
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: list issue remote links
    description: Get remote issue links
    method: GET
    url: https://{base_url}/rest/api/3/issue/{issueIdOrKey}/remotelink
    read_only: true
    params:
      - name: issueIdOrKey
        type: string
        required: true
        location: path
        description: The ID or key of the issue.
      - name: globalId
        type: string
        required: false
        location: query
        description: The global ID of the remote issue link.
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: find issues by text
    description: Get issue picker suggestions
    method: GET
    url: https://{base_url}/rest/api/3/issue/picker
    read_only: true
    params:
      - name: query
        type: string
        required: false
        location: query
        description: A string to match against text fields in the issue such as title, description, or comments.
      - name: currentJQL
        type: string
        required: false
        location: query
        description: A JQL query defining a list of issues to search for the query term. Note that
          `username` and `userkey` cannot be used as search terms for this parameter, due to privacy
          reasons. Use `accountId` instea
      - name: currentIssueKey
        type: string
        required: false
        location: query
        description: The key of an issue to exclude from search results. For example, the issue the user is
          viewing when they perform this query.
      - name: currentProjectId
        type: string
        required: false
        location: query
        description: The ID of a project that suggested issues must belong to.
      - name: showSubTasks
        type: boolean
        required: false
        location: query
        description: Indicate whether to include subtasks in the suggestions list.
      - name: showSubTaskParent
        type: boolean
        required: false
        location: query
        description: When `currentIssueKey` is a subtask, whether to include the parent issue in the
          suggestions if it matches the query.
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: get issue link
    description: Get issue link
    method: GET
    url: https://{base_url}/rest/api/3/issueLink/{linkId}
    read_only: true
    params:
      - name: linkId
        type: string
        required: true
        location: path
        description: The ID of the issue link.
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: list issue link types
    description: Get issue link types
    method: GET
    url: https://{base_url}/rest/api/3/issueLinkType
    read_only: true
    params:
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: get attachment metadata
    description: Get attachment metadata
    method: GET
    url: https://{base_url}/rest/api/3/attachment/{id}
    read_only: true
    params:
      - name: id
        type: string
        required: true
        location: path
        description: The ID of the attachment.
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: list project issue types metadata
    description: Get create metadata issue types for a project
    method: GET
    url: https://{base_url}/rest/api/3/issue/createmeta/{projectIdOrKey}/issuetypes
    read_only: true
    params:
      - name: projectIdOrKey
        type: string
        required: true
        location: path
        description: The ID or key of the project.
      - name: startAt
        type: integer
        format: int32
        required: false
        location: query
        description: The index of the first item to return in a page of results (page offset).
      - name: maxResults
        type: integer
        format: int32
        required: false
        location: query
        description: The maximum number of items to return per page.
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: list issue type field metadata
    description: Get create field metadata for a project and issue type id
    method: GET
    url: https://{base_url}/rest/api/3/issue/createmeta/{projectIdOrKey}/issuetypes/{issueTypeId}
    read_only: true
    params:
      - name: projectIdOrKey
        type: string
        required: true
        location: path
        description: The ID or key of the project.
      - name: issueTypeId
        type: string
        required: true
        location: path
        description: The issuetype ID.
      - name: startAt
        type: integer
        format: int32
        required: false
        location: query
        description: The index of the first item to return in a page of results (page offset).
      - name: maxResults
        type: integer
        format: int32
        required: false
        location: query
        description: The maximum number of items to return per page.
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: list projects
    description: Get projects paginated
    method: GET
    url: https://{base_url}/rest/api/3/project/search
    read_only: true
    params:
      - name: startAt
        type: integer
        format: int64
        required: false
        location: query
        description: The index of the first item to return in a page of results (page offset).
      - name: maxResults
        type: integer
        format: int32
        required: false
        location: query
        description: The maximum number of items to return per page. Must be less than or equal to 100. If a
          value greater than 100 is provided, the `maxResults` parameter will default to 100.
      - name: orderBy
        type: string
        enum:
          - category
          - -category
          - +category
          - key
          - -key
          - +key
          - name
          - -name
          - +name
          - owner
          - -owner
          - +owner
          - issueCount
          - -issueCount
          - +issueCount
          - lastIssueUpdatedDate
          - -lastIssueUpdatedDate
          - +lastIssueUpdatedDate
          - archivedDate
          - +archivedDate
          - -archivedDate
          - deletedDate
          - +deletedDate
          - -deletedDate
        required: false
        location: query
        description: >
          [Order](#ordering) the results by a field.

           *  `category` Sorts by project category. A complete list of category IDs is found using [Get all project categories](#api-rest-api-3-projectCategory-get).
      - name: id
        type: array
        items_type: integer
        required: false
        location: query
        description: The project IDs to filter the results by. To include multiple IDs, provide an
          ampersand-separated list. For example, `id=10000&id=10001`. Up to 50 project IDs can be
          provided.
      - name: keys
        type: array
        items_type: string
        required: false
        location: query
        description: The project keys to filter the results by. To include multiple keys, provide an
          ampersand-separated list. For example, `keys=PA&keys=PB`. Up to 50 project keys can be
          provided.
      - name: query
        type: string
        required: false
        location: query
        description: Filter the results using a literal string. Projects with a matching `key` or `name` are
          returned (case insensitive).
      - name: typeKey
        type: string
        required: false
        location: query
        description: Orders results by the [project
          type](https://confluence.atlassian.com/x/GwiiLQ#Jiraapplicationsoverview-Productfeaturesandprojecttypes).
          This parameter accepts a comma-separated list. Valid values are
      - name: categoryId
        type: integer
        format: int64
        required: false
        location: query
        description: The ID of the project's category. A complete list of category IDs is found using the
          [Get all project categories](#api-rest-api-3-projectCategory-get) operation.
      - name: action
        type: string
        enum:
          - view
          - browse
          - edit
          - create
        required: false
        location: query
        description: |-
          Filter results by projects for which the user can:

           *  `view` the project, meaning that they have one of the following permissions:
              
               *  *Browse projects* [project permission](https://conflue
      - name: expand
        type: string
        required: false
        location: query
        description: >-
          Use [expand](#expansion) to include additional information in the response. This parameter
          accepts a comma-separated list. Expanded options include:

           *  `description` Returns the project description.
      - name: status
        type: array
        items_type: string
        enum:
          - live
          - archived
          - deleted
        required: false
        location: query
        description: |-
          EXPERIMENTAL. Filter results by project status:

           *  `live` Search live projects.
           *  `archived` Search archived projects.
           *  `deleted` Search deleted projects, those in the recycle bin.
      - name: properties
        type: array
        items_type: string
        required: false
        location: query
        description: EXPERIMENTAL. A list of project properties to return for the project. This parameter
          accepts a comma-separated list.
      - name: propertyQuery
        type: string
        required: false
        location: query
        description: EXPERIMENTAL. A query string used to search properties. The query string cannot be
          specified using a JSON object. For example, to search for the value of `nested` from
          `{"something":{"nested":1,"other
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: get project
    description: Get project
    method: GET
    url: https://{base_url}/rest/api/3/project/{projectIdOrKey}
    read_only: true
    params:
      - name: projectIdOrKey
        type: string
        required: true
        location: path
        description: The project ID or project key (case sensitive).
      - name: expand
        type: string
        required: false
        location: query
        description: Use [expand](#expansion) to include additional information in the response. This
          parameter accepts a comma-separated list. Note that the project description, issue types,
          and project lead are included
      - name: properties
        type: array
        items_type: string
        required: false
        location: query
        description: A list of project properties to return for the project. This parameter accepts a
          comma-separated list.
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: list recent projects
    description: Get recent projects
    method: GET
    url: https://{base_url}/rest/api/3/project/recent
    read_only: true
    params:
      - name: expand
        type: string
        required: false
        location: query
        description: >-
          Use [expand](#expansion) to include additional information in the response. This parameter
          accepts a comma-separated list. Expanded options include:

           *  `description` Returns the project description.
      - name: properties
        type: array
        items_type: string
        required: false
        location: query
        description: EXPERIMENTAL. A list of project properties to return for the project. This parameter
          accepts a comma-separated list. Invalid property names are ignored.
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: list project components
    description: Get project components
    method: GET
    url: https://{base_url}/rest/api/3/project/{projectIdOrKey}/components
    read_only: true
    params:
      - name: projectIdOrKey
        type: string
        required: true
        location: path
        description: The project ID or project key (case sensitive).
      - name: componentSource
        type: string
        enum:
          - jira
          - compass
          - auto
        required: false
        location: query
        description: The source of the components to return. Can be `jira` (default), `compass` or `auto`.
          When `auto` is specified, the API will return connected Compass components if the project
          is opted into Compass, o
      - name: base_url
        type: string
        required: true
        location: path
        description: Your site host, e.g. yourteam.atlassian.net
  - name: list project versions
    description: Get project versions
    method: GET
    url: https://{base_url}/rest/api/3/project/{projectIdOrKey}/versions
    read_only: true
    params:
      - name: projectIdOrKey
        type: string
        required: true
        location: path
        description: The project ID or project key (case sensitive).
      - name: expand
        type: string
        required: false
