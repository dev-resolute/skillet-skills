slug: stripe
version: 1.1.0
name: Stripe
category: business-support
one_liner: Read payments, customers, billing, and Connect data from your Stripe account.
api_domain: api.stripe.com
status: live
credentials:
  - env_var: STRIPE_API_TOKEN
    label: Stripe secret key
    help_url: https://docs.stripe.com/keys
auth:
  scheme: bearer
  header: Authorization
  env_vars:
    - STRIPE_API_TOKEN
  value_template: Bearer ${STRIPE_API_TOKEN}
operations:
  - name: retrieve balance
    description: Retrieve the current account balance.
    method: GET
    url: https://api.stripe.com/v1/balance
    read_only: true
    params:
      - name: expand
        type: array
        items_type: string
        required: false
        location: query
        description: Specifies which fields in the response should be expanded.
  - name: list balance transactions
    description: List all balance transactions
    method: GET
    url: https://api.stripe.com/v1/balance_transactions
    read_only: true
    params:
      - name: created
        type: integer
        required: false
        location: query
        description: Creation time as a Unix timestamp (seconds). Matches objects created at exactly this
          second; Stripe's range form (created[gte], created[lte]) is a deepObject and is not
          expressible here.
      - name: currency
        type: string
        format: currency
        required: false
        location: query
        description: Only return transactions in a certain currency. Three-letter [ISO currency
          code](https://www.iso.org/iso-4217-currency-codes.html), in lowercase. Must be a
          [supported currency](https://stripe.com/docs
      - name: ending_before
        type: string
        required: false
        location: query
        description: A cursor for use in pagination. `ending_before` is an object ID that defines your place
          in the list. For instance, if you make a list request and receive 100 objects, starting
          with `obj_bar`, your sub
      - name: expand
        type: array
        items_type: string
        required: false
        location: query
        description: Specifies which fields in the response should be expanded.
      - name: limit
        type: integer
        required: false
        location: query
        description: A limit on the number of objects to be returned. Limit can range between 1 and 100, and
          the default is 10.
      - name: payout
        type: string
        required: false
        location: query
        description: For automatic Stripe payouts only, only returns transactions that were paid out on the
          specified payout ID.
      - name: source
        type: string
        required: false
        location: query
        description: Only returns transactions associated with the given object.
      - name: starting_after
        type: string
        required: false
        location: query
        description: A cursor for use in pagination. `starting_after` is an object ID that defines your
          place in the list. For instance, if you make a list request and receive 100 objects,
          ending with `obj_foo`, your subs
      - name: type
        type: string
        required: false
        location: query
        description: "Only returns transactions of the given type. One of: `tax_fund`, `adjustment`,
          `advance`, `advance_funding`, `anticipation_repayment`, `application_fee`,
          `application_fee_refund`, `charge`, `climate_o"
