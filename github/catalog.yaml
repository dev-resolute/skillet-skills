      - name: repo
        type: string
        required: true
        location: path
        description: The name of the repository without the `.git` extension. The name is not case sensitive.
      - name: tree_sha
        type: string
        required: true
        location: path
        description: The SHA1 value or ref (branch or tag) name of the tree.
      - name: recursive
        type: string
        required: false
        location: query
        description: Setting this parameter to any value returns the objects or subtrees referenced by the
          tree specified in `:tree_sha`. For example, setting `recursive` to any of the following
          will enable returning obje
  - name: get git reference
    description: Get a reference
    method: GET
    url: https://api.github.com/repos/{owner}/{repo}/git/ref/{ref}
    read_only: true
    params:
      - name: owner
        type: string
        required: true
        location: path
        description: The account owner of the repository. The name is not case sensitive.
      - name: repo
        type: string
        required: true
        location: path
        description: The name of the repository without the `.git` extension. The name is not case sensitive.
      - name: ref
        type: string
        required: true
        location: path
        description: The Git reference. For more information, see "[Git
