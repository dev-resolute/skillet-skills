          API](https://docs.github.com/rest/using-the-rest-api/using-pagination-in-the-rest-api)."
      - name: ref
        type: string
        required: true
        location: path
        description: The commit reference. Can be a commit SHA, branch name (`heads/BRANCH_NAME`), or tag
          name (`tags/TAG_NAME`). For more information, see "[Git
          References](https://git-scm.com/book/en/v2/Git-Internals-Gi
  - name: get file contents
    description: Get repository content
    method: GET
    url: https://api.github.com/repos/{owner}/{repo}/contents/{path}
