slug: github
version: 1.1.0
name: GitHub
category: dev-code
one_liner: Search and read repos, issues, pull requests, and Actions — and open issues.
api_domain: api.github.com
status: live
credentials:
  - env_var: GITHUB_API_TOKEN
    label: GitHub personal access token
    help_url: https://docs.github.com/en/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens
auth:
  scheme: bearer
  header: Authorization
  env_vars:
    - GITHUB_API_TOKEN
  value_template: Bearer ${GITHUB_API_TOKEN}
operations:
  - name: get authenticated user
    description: Get the authenticated user
    method: GET
    url: https://api.github.com/user
    read_only: true
    params: []
  - name: list repositories
    description: List repositories for the authenticated user.
    method: GET
    url: https://api.github.com/user/repos
    read_only: true
    params:
      - name: visibility
        type: string
        enum:
          - all
          - public
          - private
        required: false
        location: query
        description: Limit results to repositories with the specified visibility.
      - name: affiliation
        type: string
        required: false
        location: query
        description: |-
          Comma-separated list of values. Can include:  
           * `owner`: Repositories that are owned by the authenticated user.  
           * `collaborator`: Repositories that the user has been added to as a collaborator.  
      - name: type
        type: string
        enum:
          - all
          - owner
          - public
          - private
          - member
        required: false
        location: query
        description: Limit results to repositories of the specified type. Will cause a `422` error if used
          in the same request as **visibility** or **affiliation**.
      - name: sort
        type: string
        enum:
          - created
          - updated
          - pushed
          - full_name
        required: false
        location: query
        description: The property to sort the results by.
      - name: direction
        type: string
        enum:
          - asc
          - desc
        required: false
        location: query
        description: "The order to sort by. Default: `asc` when using `full_name`, otherwise `desc`."
      - name: per_page
        type: integer
        required: false
        location: query
        description: The number of results per page (max 100). For more information, see "[Using pagination
          in the REST
          API](https://docs.github.com/rest/using-the-rest-api/using-pagination-in-the-rest-api)."
      - name: page
        type: integer
        required: false
        location: query
        description: The page number of the results to fetch. For more information, see "[Using pagination
          in the REST
          API](https://docs.github.com/rest/using-the-rest-api/using-pagination-in-the-rest-api)."
      - name: since
        type: string
        format: date-time
        required: false
        location: query
        description: "Only show repositories updated after the given time. This is a timestamp in [ISO
          8601](https://en.wikipedia.org/wiki/ISO_8601) format: `YYYY-MM-DDTHH:MM:SSZ`."
      - name: before
        type: string
        format: date-time
        required: false
        location: query
        description: "Only show repositories updated before the given time. This is a timestamp in [ISO
          8601](https://en.wikipedia.org/wiki/ISO_8601) format: `YYYY-MM-DDTHH:MM:SSZ`."
  - name: list starred repositories
    description: List repositories starred by the authenticated user
    method: GET
    url: https://api.github.com/user/starred
    read_only: true
    params:
      - name: sort
        type: string
        enum:
          - created
          - updated
        required: false
        location: query
        description: The property to sort the results by. `created` means when the repository was starred.
          `updated` means when the repository was last pushed to.
      - name: direction
        type: string
        enum:
          - asc
          - desc
        required: false
        location: query
        description: The direction to sort the results by.
      - name: per_page
        type: integer
        required: false
        location: query
        description: The number of results per page (max 100). For more information, see "[Using pagination
          in the REST
          API](https://docs.github.com/rest/using-the-rest-api/using-pagination-in-the-rest-api)."
      - name: page
        type: integer
        required: false
        location: query
        description: The page number of the results to fetch. For more information, see "[Using pagination
          in the REST
          API](https://docs.github.com/rest/using-the-rest-api/using-pagination-in-the-rest-api)."
  - name: list teams
    description: List teams
    method: GET
    url: https://api.github.com/orgs/{org}/teams
    read_only: true
    params:
      - name: org
        type: string
        required: true
        location: path
        description: The organization name. The name is not case sensitive.
      - name: per_page
        type: integer
        required: false
        location: query
        description: The number of results per page (max 100). For more information, see "[Using pagination
          in the REST
          API](https://docs.github.com/rest/using-the-rest-api/using-pagination-in-the-rest-api)."
      - name: page
        type: integer
        required: false
        location: query
        description: The page number of the results to fetch. For more information, see "[Using pagination
          in the REST
          API](https://docs.github.com/rest/using-the-rest-api/using-pagination-in-the-rest-api)."
      - name: team_type
        type: string
        enum:
          - all
          - enterprise
          - organization
        required: false
        location: query
        description: Filter team results by their type. For more information, see "[What kind of team should
          I
          use?](https://docs.github.com/enterprise-cloud@latest/admin/concepts/enterprise-fundamentals/teams-in-an-enter
  - name: list team members
    description: List team members
    method: GET
    url: https://api.github.com/orgs/{org}/teams/{team_slug}/members
    read_only: true
    params:
      - name: org
        type: string
        required: true
        location: path
        description: The organization name. The name is not case sensitive.
      - name: team_slug
        type: string
        required: true
        location: path
        description: The slug of the team name.
      - name: role
        type: string
        enum:
          - member
          - maintainer
          - all
        required: false
        location: query
        description: Filters members returned by their role in the team.
      - name: per_page
        type: integer
        required: false
        location: query
        description: The number of results per page (max 100). For more information, see "[Using pagination
          in the REST
          API](https://docs.github.com/rest/using-the-rest-api/using-pagination-in-the-rest-api)."
      - name: page
        type: integer
        required: false
        location: query
        description: The page number of the results to fetch. For more information, see "[Using pagination
          in the REST
          API](https://docs.github.com/rest/using-the-rest-api/using-pagination-in-the-rest-api)."
  - name: get repository
    description: Get a repository
    method: GET
    url: https://api.github.com/repos/{owner}/{repo}
    read_only: true
    params:
      - name: owner
        type: string
        required: true
        location: path
        description: The account owner of the repository. The name is not case sensitive.
      - name: repo
        type: string
        required: true
        location: path
        description: The name of the repository without the `.git` extension. The name is not case sensitive.
  - name: list branches
    description: List branches
    method: GET
    url: https://api.github.com/repos/{owner}/{repo}/branches
    read_only: true
    params:
      - name: owner
        type: string
        required: true
        location: path
        description: The account owner of the repository. The name is not case sensitive.
      - name: repo
        type: string
        required: true
        location: path
        description: The name of the repository without the `.git` extension. The name is not case sensitive.
      - name: protected
        type: boolean
        required: false
        location: query
        description: Setting to `true` returns only branches protected by branch protections or rulesets.
          When set to `false`, only unprotected branches are returned. Omitting this parameter
          returns all branches.
      - name: per_page
        type: integer
        required: false
        location: query
        description: The number of results per page (max 100). For more information, see "[Using pagination
          in the REST
          API](https://docs.github.com/rest/using-the-rest-api/using-pagination-in-the-rest-api)."
      - name: page
        type: integer
        required: false
        location: query
        description: The page number of the results to fetch. For more information, see "[Using pagination
          in the REST
          API](https://docs.github.com/rest/using-the-rest-api/using-pagination-in-the-rest-api)."
  - name: list commits
    description: List commits
