        description: The name of the repository without the `.git` extension. The name is not case sensitive.
      - name: sha
        type: string
        required: false
        location: query
        description: "SHA or branch to start listing commits from. Default: the repository’s default branch
          (usually `main`)."
      - name: path
        type: string
        required: false
        location: query
        description: Only commits containing this file path will be returned.
      - name: author
        type: string
        required: false
        location: query
        description: GitHub username or email address to use to filter by commit author.
      - name: committer
        type: string
        required: false
        location: query
        description: GitHub username or email address to use to filter by commit committer.
      - name: since
        type: string
        format: date-time
        required: false
        location: query
        description: "Only show results that were last updated after the given time. This is a timestamp in
          [ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) format: `YYYY-MM-DDTHH:MM:SSZ`. Due to
          limitations of Git, time"
      - name: until
        type: string
        format: date-time
        required: false
        location: query
        description: "Only commits before this date will be returned. This is a timestamp in [ISO
          8601](https://en.wikipedia.org/wiki/ISO_8601) format: `YYYY-MM-DDTHH:MM:SSZ`. Due to
          limitations of Git, timestamps must be "
      - name: per_page
        type: integer
        required: false
        location: query
        description: The number of results per page (max 100). For more information, see "[Using pagination
          in the REST
          API](https://docs.github.com/rest/using-the-rest-api/using-pagination-in-the-rest-api)."
      - name: page
        type: integer
        required: false
        location: query
        description: The page number of the results to fetch. For more information, see "[Using pagination
          in the REST
          API](https://docs.github.com/rest/using-the-rest-api/using-pagination-in-the-rest-api)."
  - name: get commit
    description: Get a commit
    method: GET
